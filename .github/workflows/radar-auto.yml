name: radar-auto

# این ورک‌فلو زمان‌بندی داخلی ندارد.
# با تریگر بیرونی هر پانزده دقیقه صدا زده می‌شود،
# چون زمان‌بندی خود گیت‌هاب با تأخیر چندساعته می‌رسد.
on:
  workflow_dispatch:
    inputs:
      src:
        description: "main = تریگر اصلی، backup = تریگر پشتیبان"
        required: false
        default: "main"
        type: choice
        options:
          - main
          - backup

permissions:
  contents: write

concurrency:
  group: radar-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: run
        env:
          API_BASE: ${{ secrets.API_BASE }}
          API_KEY: ${{ secrets.API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          TG_PERSONAL: ${{ secrets.TG_PERSONAL }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python radar.py auto --src "${{ inputs.src || 'main' }}"
      - name: save
        if: always()
        run: bash .github/save.sh
